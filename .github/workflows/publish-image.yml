name: publish-image

# Build the VEFR engine image once in CI and publish it to GitHub
# Container Registry. The portable compose.yaml consumes the published
# image; compose.dev.yaml still builds locally from source for
# development.
#
# Triggered via `workflow_run` after the `ci` workflow completes
# successfully on main — that keeps this job from ever publishing a
# known-broken image merely because a push occurred. SHA tags are
# immutable and are the documented rollback path; `latest` advances
# on each successful main publish.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.repository.owner.login }}/vefr

jobs:
  publish:
    # workflow_run only fires after the upstream completed; gate on its
    # conclusion so a failed ci never ships an image.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve validated SHA
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.event.repository.full_name }}
        run: |
          set -euo pipefail
          sha=$(gh api "/repos/${REPO}/actions/runs/${RUN_ID}" \
              --jq '.head_sha')
          echo "head_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Publishing image for ${REPO}@${sha}"

      - name: Checkout validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main publish → :latest and :sha-<full SHA>; the SHA tag is
          # immutable and is the documented rollback handle.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=vefr
            org.opencontainers.image.description=vefr — a rumor engine for playable worlds
            org.opencontainers.image.source=https://github.com/${{ github.event.repository.full_name }}
            org.opencontainers.image.licenses=MPL-2.0
            org.opencontainers.image.revision=${{ steps.sha.outputs.head_sha }}
            org.opencontainers.image.created=${{ github.event.workflow_run.head_commit.timestamp }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENGINE_SHA=${{ steps.sha.outputs.head_sha }}
          provenance: false
