name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks full-history scan
    runs-on: ubuntu-latest
    # Allow manual runs even if recent runs failed.
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # The full history is needed because VEFR has had two
          # history rewrites already; secrets can hide in any
          # commit, not just HEAD.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
