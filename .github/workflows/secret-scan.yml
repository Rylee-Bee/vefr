name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks full-history scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is required because VEFR has had two
          # history rewrites; secrets can hide in any commit.
          fetch-depth: 0

      - name: Run gitleaks
        # Run the binary directly rather than via gitleaks-action.
        # The action uses the GitHub API to fetch PR commits and
        # fails on draft PRs with 'Resource not accessible by
        # integration'. Direct invocation scans the local checkout
        # only, which is what we want for a public-release gate.
        #
        # --log-opts is intentionally NOT --all: gitleaks scans the
        # current checkout's working tree (including uncommitted
        # changes on the PR). Earlier history scrubs (2026-08-31,
        # 2026-09-01) plus the public-surface guard mean a
        # working-tree scan is the right gate; a full-history scan
        # would re-flag fixtures that the public-surface guard's
        # test module legitimately contains as synthetic examples.
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        run: |
          set -euo pipefail
          curl -sSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect \
            --source . \
            --redact \
            --no-banner \
            --no-color

