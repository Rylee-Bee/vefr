name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks full-history scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required because VEFR has had two
          # history rewrites; secrets can hide in any commit.
          fetch-depth: 0

      - name: Run gitleaks
        # Run the binary directly rather than via gitleaks-action.
        # The action uses the GitHub API to fetch PR commits and
        # fails on draft PRs with 'Resource not accessible by
        # integration'. Direct invocation scans the local checkout
        # only, which is what we want for a public-release gate.
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        run: |
          set -euo pipefail
          curl -sSL --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect \
            --source . \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --no-color \
            --baseline-path .gitleaks-baseline.json

