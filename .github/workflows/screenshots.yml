name: screenshots

on:
  push:
    branches: [main]
    paths:
      - 'web/packaged.html'
      - 'web/screens/**'
      - 'web/shell.*'
      - 'src/vefr/weave.py'
      - 'worlds/sample-world/**'
      - 'scripts/capture-screenshots.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: capture workshop + export screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: ignore[artipacked] because this workflow
        # commits captured screenshots back to main; it needs the
        # checkout token. Scope is contents: write on main only.

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync deps
        run: uv sync --group test

      - name: Install Playwright chromium
        run: uv run playwright install chromium --with-deps

      - name: Start engine (sample-world, no model)
        run: |
          uv run uvicorn vefr.main:app --app-dir src --port 8820 &
          sleep 3
          curl -sf http://127.0.0.1:8820/api/health || exit 1
        env:
          VEFR_WORLD: sample-world

      - name: Generate woven HTML
        run: uv run ratatoskr weave --pack worlds/sample-world

      - name: Capture screenshots
        run: uv run python scripts/capture-screenshots.py

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ github.sha }}
          path: docs/screenshots/*.png
          retention-days: 30
