name: screenshots

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/vefr/**'
      - 'worlds/sample-world/**'
      - 'scripts/capture-screenshots.py'
  workflow_dispatch:

# Read-only: the gallery is uploaded as an artifact for review. The
# committed gallery in docs/screenshots/ is refreshed by running the
# script locally (see its docstring) and committing the result.
permissions:
  contents: read

jobs:
  capture:
    name: capture the studio + player screenshots gallery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync deps
        run: uv sync --group test

      - name: Install Playwright chromium
        run: uv run --group test playwright install chromium --with-deps

      - name: Start engine (sample-world, no model)
        run: |
          uv run uvicorn vefr.main:app --app-dir src --port 8820 &
          sleep 3
          curl -sf http://127.0.0.1:8820/api/health || exit 1
        env:
          VEFR_WORLD: sample-world

      - name: Generate woven HTML
        run: uv run ratatoskr weave --pack worlds/sample-world

      - name: Capture screenshots
        run: uv run --group test python scripts/capture-screenshots.py

      - name: Upload screenshots as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ github.sha }}
          path: |
            docs/screenshots/*.jpg
            docs/screenshots/README.md
          retention-days: 30
