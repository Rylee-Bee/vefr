name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: ruff + pytest + sample-world + public-surface guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history is needed for the Storyteller-WIP-aware
          # public-surface guard and for any future gitleaks step.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync test deps
        run: uv sync --group test

      - name: Ruff
        run: uv run --group test ruff check src tests scripts

      - name: Install node dev deps (test harnesses only)
        # package.json is dev-only tooling (jsdom for the kitchen
        # harness). Nothing in it ships or runs at runtime.
        run: npm ci

      - name: Pytest (public - blocks CI)
        # The Storyteller WIP lane (homelab issue rylee/vefr#50)
        # carries known-in-flight failures in tests/test_npc_action.py
        # and tests/test_storyteller_benchmark.py. Those modules are
        # in the AGENTS.md "Active checkout and Storyteller WIP"
        # protected list and stay off the public-release branch until
        # the story-team design lands. The CI pytest run below is
        # the *public* suite and is blocking - any genuine regression
        # fails the build. When Storyteller lands, remove both
        # --ignore lines from this command in the same PR that
        # introduces the Storyteller test files.
        run: |
          uv run --group test pytest -q \
            --ignore=tests/test_npc_action.py \
            --ignore=tests/test_storyteller_benchmark.py

      - name: Pytest (informational - WIP-known-failures)
        # Full pytest run as informational only. Reports the current
        # status of the Storyteller WIP test set without blocking
        # CI. When the WIP team flips these to green, drop this
        # informational step and the --ignore flags above.
        if: always()
        continue-on-error: true
        run: uv run --group test pytest -q tests/test_npc_action.py tests/test_storyteller_benchmark.py

      - name: Validate sample-world
        run: uv run --group test norns validate --pack worlds/sample-world

      - name: Public-surface guard
        run: python3 scripts/check_public_surface.py
