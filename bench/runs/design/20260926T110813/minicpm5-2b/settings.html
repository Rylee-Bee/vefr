<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings · Local tool</title>
<link rel="stylesheet" href="/workbench.css">
</head>
<body class="wb-page">
<a class="wb-btn wb-btn--quiet" href="#main" style="position:absolute;left:-999px">Skip to content</a>
<header class="wb-topbar"><div class="wb-wrap">
  <nav aria-label="Breadcrumb"><ol class="wb-crumbs">
    <li><a href="/">Gallery</a></li>
    <li><a href="/local/">Local tool</a></li>
    <li aria-current="page">Settings</li>
  </ol></nav>
</div></header>
<main id="main" class="wb-wrap">
  <h1 class="wb-h1">Settings</h1>
  <p class="wb-lede">Configure your local tool settings.</p>

  <section class="wb-section">
    <h2 class="wb-h2">Theme</h2>
    <div class="wb-theme-buttons">
      <a class="wb-btn wb-btn--primary" href="#">Dark</a>
      <a class="wb-btn" href="#">Light</a>
      <a class="wb-btn" href="#">High contrast</a>
    </div>
  </section>

  <section class="wb-section">
    <h2 class="wb-h2">Storage</h2>
    <div class="wb-table-wrap"><table class="wb-table">
      <thead><tr><th scope="col">Folder</th><th scope="col">Size</th></tr></thead>
      <tbody>
        <tr><td class="wb-mono">Documents</td><td class="wb-mono">2.1 MB</td></tr>
        <tr><td class="wb-mono">Cache</td><td class="wb-mono">1.2 MB</td></tr>
      </tbody>
    </table></div>
  </section>

  <section class="wb-section">
    <h2 class="wb-h2">Danger zone</h2>
    <div class="wb-danger-zone">
      <span class="wb-warning-tag">⚠ Cannot be undone</span>
      <a class="wb-btn wb-btn--danger" href="#">Clear cache</a>
    </div>
  </section>
</main>
</body>
</html>
