<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings · Tool name</title>
<link rel="stylesheet" href="/workbench.css">
</head>
<body class="wb-page">
<a class="wb-btn wb-btn--quiet" href="#main" style="position:absolute;left:-999px">Skip to content</a>
<header class="wb-topbar"><div class="wb-wrap">
  <nav aria-label="Breadcrumb"><ol class="wb-crumbs">
    <li><a href="/">Tool name</a></li><li aria-current="page">Settings</li>
  </ol></nav>
</div></header>
<main id="main" class="wb-wrap">
  <h1 class="wb-h1">Settings</h1>
  <p class="wb-lede">Configure your tool preferences.</p>

  <section class="wb-section">
    <h2 class="wb-h2">Theme</h2>
    <div class="wb-actions">
      <a class="wb-btn wb-btn--primary" href="#" data-theme="light">Light</a>
      <a class="wb-btn wb-btn--primary wb-btn--selected" href="#" data-theme="dark">Dark</a>
      <a class="wb-btn wb-btn--quiet" href="#" data-theme="high-contrast">High contrast</a>
    </div>
  </section>

  <section class="wb-section">
    <h2 class="wb-h2">Storage</h2>
    <div class="wb-table-wrap">
      <table class="wb-table">
        <thead>
          <tr>
            <th scope="col">Folder</th>
            <th scope="col">Size</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>~/cache</td>
            <td class="wb-mono">1.2 GB</td>
          </tr>
          <tr>
            <td>~/art</td>
            <td class="wb-mono">450 MB</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="wb-section">
    <h2 class="wb-h2">Danger zone</h2>
    <div class="wb-actions">
      <button class="wb-btn wb-btn--danger" type="button">Clear cache</button>
    </div>
    <p class="wb-warning">
      <span class="wb-tag wb-tag--danger">⚠️ Warning</span>
      This action cannot be undone. All cached data will be permanently deleted.
    </p>
  </section>
</main>
</body>
</html>
