# Ministral 3 3B Instruct - tiny Apache-2.0 candidate.
#
# Per the 2026-09-04 VEFR AI direction. 3.4B LM (FP8 native, ~4 GB on
# disk as published), 256K context, Apache-2.0 (clean redistribution).
# Vision encoder (0.4B) bundled but the engine never uses it for the
# audition.
#
# Role: tiny open-license candidate. Question: "Does a clean Apache
# 3B give us better character behavior?"
#
# IMPORTANT SAMPLING NOTE: Mistral's published recommendation is
# temperature <= 0.1 for daily-driver use. We deliberately raise it
# to 0.8 for the audition because we are testing creative prose, not
# chat-correctness. If this pack ever becomes the recommended default,
# revisit whether the temperature bump survives contact with the
# model's actual output style.

[storyteller]
id = "ministral3-3b"
name = "Ministral 3 3B Instruct"
version = "0.1.0"

[model]
provider = "openai-compatible"
model = "Ministral-3-3B-Instruct-2512"
source = "huggingface"
context_window = 262144

[capabilities]
text = true
structured_output = false
tools = false
vision = false

# Baseline shared with the other audition packs for fair comparison.
[sampling]
temperature = 0.8
top_p = 0.9

[chat_template_kwargs]

[templates]
system = "system.md"
scene = "scene.md"
character = "character.md"
memory = "memory.md"

[license]
name = "Ministral 3 (Mistral AI)"
spdx = "Apache-2.0"
source_url = "https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512"
redistribution = "allowed"
commercial_use = "allowed"
attribution = "Ministral 3 3B Instruct 2512 by Mistral AI, Apache-2.0"
notes = "Apache-2.0 across the board. Published weights are FP8; quantize further if disk/CPU matter."

[install]
weights_source = "huggingface"
weights_repo = "mistralai/Ministral-3-3B-Instruct-2512"
recommended_quant = "Q4_K_M"
approx_disk_mb = 2200
fetch_command = "# ollama pull Ministral-3-3B-Instruct-2512  OR  llama.cpp from HF"
attribution_url = "https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512"

[notes]
text = """
Audition pack. Clean Apache-2.0 with no Gemma-style additional terms.
Mistral's chat template handles the system role natively.
"""
