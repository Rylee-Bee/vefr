# Local development override. Builds from the current source tree
# instead of pulling the published image, so a developer can iterate
# against the Containerfile and the live code without a GHCR push.
#
# Usage:
#   podman compose -f compose.yml -f compose.dev.yaml up --build
#
# This override is the ONLY place a `build:` clause should appear.
# The portable base compose.yaml must stay image-only so any host
# can boot without the source tree.

services:
  vefr:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/vefr:dev
    # Never reach GHCR for a local build — only the published tags do.
    pull_policy: never
