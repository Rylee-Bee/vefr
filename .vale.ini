# Vale — the studio's house voice for prose.
#
# Advisory for now: the CI job runs with fail_on_error=false, so this
# reports style without blocking a PR. Promote rules to errors only once
# the existing docs pass. Markdown only; code comments are not prose.
#
# The built-in `Vale` style needs no network (no `vale sync`): it is the
# spelling/repetition/wordiness set that ships with Vale itself.

MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Vale
