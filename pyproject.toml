[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vefr"
version = "2.0.0"
description = "vefr - a rumor engine for playable worlds. Weaves whichever story you give it. Take the bones, grow your own flesh."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[dependency-groups]
test = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The gate catches dead code and real errors mechanically; style
# rules stay off - the pytest suite covers behavior, and style
# churn in engine files isn't the point.
select = ["E4", "E7", "E9", "F"]

[project.scripts]
ratatoskr = "vefr.cli:ratatoskr_main"
norns = "vefr.cli:norns_main"

[tool.hatch.build.targets.wheel]
packages = ["src/vefr"]
