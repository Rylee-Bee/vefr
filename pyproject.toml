[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vefr"
version = "2.1.0"
description = "vefr - a rumor engine for playable worlds. Weaves whichever story you give it. Take the bones, grow your own flesh."
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[dependency-groups]
test = [
    "playwright>=1.63.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The gate catches dead code and real errors mechanically; style
# rules stay off - the pytest suite covers behavior, and style
# churn in engine files isn't the point.
select = ["E4", "E7", "E9", "F"]

[project.scripts]
ratatoskr = "vefr.cli:ratatoskr_main"
norns = "vefr.cli:norns_main"
vefr-lore = "vefr.lore_shell:main"
vefr-interface = "vefr.interface:main"
vefr-story = "vefr.narrate:main"

[tool.pytest.ini_options]
filterwarnings = [
    # Starlette's TestClient re-exports httpx; httpx2 is the official
    # replacement but fastapi hasn't migrated yet.  Cosmetic only —
    # no functional impact.  Silenced to keep the warning budget at zero.
    "ignore:.*httpx.*starlette.*:UserWarning",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vefr"]

[tool.hatch.build.targets.wheel.force-include]
# weave's player template ships as package data so a pip-installed
# engine can weave from a pack author's repo (site-packages/vefr/web/).
"web/packaged.html" = "vefr/web/packaged.html"
"web/art/illustrations/player-title.webp" = "vefr/web/art/illustrations/player-title.webp"
"web/fonts/Cinzel-Variable.woff2" = "vefr/web/fonts/Cinzel-Variable.woff2"
"web/fonts/AtkinsonHyperlegibleNext-Regular.woff2" = "vefr/web/fonts/AtkinsonHyperlegibleNext-Regular.woff2"
"web/fonts/AtkinsonHyperlegibleNext-Bold.woff2" = "vefr/web/fonts/AtkinsonHyperlegibleNext-Bold.woff2"
