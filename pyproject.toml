[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "old-name"
version = "2.0.0"
description = "old-name - a rumor engine for playable worlds. Take the bones, grow your own flesh."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "pydantic>=2.10",
]

[dependency-groups]
test = ["pytest>=8.3"]

[project.scripts]
raven = "old-name.cli:raven_main"
old-name = "old-name.cli:smidr_main"

[tool.hatch.build.targets.wheel]
packages = ["src/old-name"]
