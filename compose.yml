# vefr — a rumor engine for playable worlds
#
# BUNDLED BRAIN (default): ships with 3 small models inside the
# container. `docker compose up` = fully playable game.
#
# EXTERNAL BRAIN: edit the env vars below to point at your own
# LLM endpoint (ollama, llama.cpp, LM Studio, etc.):
#
#   environment:
#     VEFR_BUNDLED_BRAIN: "0"
#     VEFR_LLAMACPP_URL: http://host.lan:8084
#     VEFR_MODEL: qwen3-1.7b

services:
  vefr:
    image: ${VEFR_IMAGE:-ghcr.io/rylee-bee/vefr:latest}
    pull_policy: always
    container_name: vefr
    network_mode: host
    environment:
      VEFR_HOME: /app
      VEFR_WORLD: ${VEFR_WORLD:-sample-world}
      VEFR_KEEP_ALIVE: 1m
      VEFR_VAULT: /app/data/vault.json
      VEFR_JOURNAL: /app/data/journal.json
      # ── Bundled brain (default) ──
      # Models run inside the container on CPU. No setup needed.
      VEFR_BUNDLED_BRAIN: "1"
      VEFR_LLAMACPP_URL: http://127.0.0.1:8084
      VEFR_MODEL: qwen3-1.7b
      VEFR_SPARK_URL: http://127.0.0.1:8083
      VEFR_EMBED_URL: http://127.0.0.1:8086
      # ── External brain (uncomment to override) ──
      # Set VEFR_BUNDLED_BRAIN=0 and point at your own endpoint:
      # VEFR_BUNDLED_BRAIN: "0"
      # VEFR_LLAMACPP_URL: http://host.lan:8084
      # VEFR_MODEL: qwen3-1.7b
    volumes:
      - vefr-template:/app/worlds-template:ro
      - vefr-worlds:/app/worlds
      - vefr-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8820/api/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  vefr-template:
  vefr-worlds:
  vefr-data:
