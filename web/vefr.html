  var asset = bin.assets[state.asset] || bin.assets[0];
  var nextId = PROPOSALS.filter(function(p){ return state.propState[p.id]==='proposal'; })[0];
  nextId = nextId ? nextId.id : null;

  var bins = FOUNDRY_BINS.map(function(b){
    return '<button class="bin-item" type="button" data-act="bin" data-id="'+b.id+'" aria-pressed="'+(b.id===bin.id)+'" data-od-id="foundry-bin-'+b.id+'">'
      + icon(b.glyph)+'<span>'+esc(b.label)+'</span><span class="bin-count">'+b.assets.length+'</span></button>';
  }).join('');

  var list = bin.assets.map(function(a, i){
    return '<button class="bin-item" type="button" data-act="asset" data-i="'+i+'" aria-pressed="'+(i===state.asset)+'" data-od-id="foundry-asset-'+i+'">'
      + '<span style="min-width:0"><span style="display:block">'+esc(a.name)+'</span>'
      + '<span class="bin-count" style="margin:2px 0 0;display:block">'+esc(a.meta)+'</span></span></button>';
  }).join('');

  var proposals = PROPOSALS.map(function(p){
    var st = state.propState[p.id];
    var isNext = p.id===nextId;
    var label = { proposal:'Proposal', kept:'Kept', accepted:'Accepted', failed:'Not made' }[st];
    var badge = { proposal:'tb-proposal', kept:'tb-player', accepted:'tb-canon', failed:'tb-stale' }[st];
    var glyph = { proposal:'plus', kept:'pin', accepted:'seal', failed:'close' }[st];
    return '<article class="forge-slip" data-state="'+st+'" data-od-id="foundry-proposal-'+p.id+'">'
      + '<div class="card-head" style="align-items:flex-start">'
        + '<span class="tb '+badge+'">'+icon(glyph,'ic--sm')+'<b>'+label+'</b></span>'
        + '<span class="card-kicker" style="margin-left:auto">'+esc(p.kind)+'</span>'
      + '</div>'
      + '<h3 style="font-size:var(--t-lg);margin-top:var(--sp-3)">'+esc(p.title)+'</h3>'
      + '<p style="margin:8px 0 0;color:var(--muted);font-size:var(--t-sm)">'+esc(p.body)+'</p>'
      + (st==='accepted' ? '<p class="stat-k" style="margin-top:var(--sp-3)">'+esc(p.wrote)+'</p>' : '')
      + (st==='failed' ? '<p class="stat-k" style="margin-top:var(--sp-3)">'+esc(p.reason)+'</p>' : '')
      + (st==='kept' ? '<p class="stat-k" style="margin-top:var(--sp-3)">'+esc(p.where)+'</p>' : '')
      + '<p style="margin:var(--sp-3) 0 0;font-size:var(--t-sm);color:var(--faint)">'+esc(p.source)+'</p>'
      + (st==='proposal'
        ? '<div style="display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-top:var(--sp-4)">'
            + '<button class="btn'+(isNext?' btn--primary':'')+'" type="button" data-act="prop-make" data-id="'+p.id+'">'+icon('check')+'<span>Make it real</span></button>'
            + '<button class="btn btn--ghost" type="button" data-act="prop-keep" data-id="'+p.id+'">'+icon('pin')+'<span>Keep it, for now</span></button>'
          + '</div>'
        : st==='kept'
        ? '<div style="display:flex;gap:var(--sp-3);flex-wrap:wrap;margin-top:var(--sp-4)">'
            + '<button class="btn'+(isNext?' btn--primary':'')+'" type="button" data-act="prop-make" data-id="'+p.id+'">'+icon('check')+'<span>Make it real</span></button>'
          + '</div>'
        : '')
    + '</article>';
  }).join('');

  var materials = [['parchment','--fg'],['brass','--accent'],['slate','--slate'],['raised wood','--raised'],['teal ink','--teal']]
    .map(function(m){ return '<span class="stamp-wrap"><span class="swatch" style="background:var('+m[1]+')" aria-hidden="true"></span><span class="stamp-cap">'+m[0]+'</span></span>'; }).join('');

  return '<section class="room room--foundry" data-room="foundry">'
    + '<header class="room-head">'
      + '<div class="eyebrow"><span>The Foundry</span><i class="rule"></i><span>world pack · emberfield v0.4.2</span><i class="rule"></i><span>schema vefr.pack/3</span></div>'
      + '<div class="room-head-row"><div>'
        + '<h1 class="room-title" data-od-id="foundry-title">The Foundry</h1>'
        + '<p class="room-sub">This room is allowed to be a tool. Trays, bins, materials, and one preview surface — where a thing proposed in conversation becomes a thing that has a place.</p>'
      + '</div><div class="room-tools">'
        + '<span class="state state--warn"><span class="state-dot"></span>'+PROPOSALS.filter(function(p){return state.propState[p.id]==='proposal';}).length+' unplaced</span>'
      + '</div></div>'
    + '</header>'

    + '<div class="foundry">'
      + '<div style="display:grid;gap:var(--sp-4)">'
        + '<div class="bin"><div class="card-head"><span class="card-kicker">bins</span></div><div style="display:grid;gap:2px">'+bins+'</div></div>'
        + '<div class="bin"><div class="card-head"><span class="card-kicker">'+esc(bin.label)+'</span><span class="bin-count" style="margin-left:auto">'+bin.assets.length+'</span></div>'
          + '<div style="display:grid;gap:2px">'+list+'</div></div>'
        + '<div class="bin"><div class="card-head"><span class="card-kicker">materials</span></div>'
          + '<div style="display:flex;gap:var(--sp-3);flex-wrap:wrap">'+materials+'</div>'
          + '<p style="margin:var(--sp-3) 0 0;font-size:var(--t-sm);color:var(--faint)">The pack carries its own palette, so anything forged here looks like it came from Emberfield.</p></div>'
      + '</div>'

      + '<div class="bench" data-od-id="foundry-bench">'
        + '<div class="card-head" style="align-items:flex-start">'
          + '<span class="card-kicker">on the bench</span>'
          + '<span class="card-kicker" style="margin-left:auto">'+esc(bin.label)+' · '+esc(asset.name)+'</span>'
        + '</div>'
        + '<div class="frame" style="margin-top:var(--sp-4)"><div class="card card--raise" style="display:grid;gap:var(--sp-4);padding:var(--sp-6)">'
          + '<div style="display:flex;gap:var(--sp-4);align-items:center">'
            + '<span class="sigil" style="width:72px;height:88px">'+icon(bin.glyph)+'</span>'
            + '<span><span class="tb tb-'+asset.truth+'">'+icon(TB[asset.truth].g,'ic--sm')+'<b>'+TB[asset.truth].label+'</b></span>'
            + '<h3 style="font-size:var(--t-2xl);margin-top:var(--sp-3)">'+esc(asset.name)+'</h3>'
            + '<p style="margin:6px 0 0;color:var(--muted)">'+esc(asset.meta)+'</p></span>'
          + '</div>'
          + '<p style="margin:0;font-size:var(--t-sm);color:var(--faint)">Preview only. Nothing on the bench is in the world until it is made real, and making something real always writes.</p>'
        + '</div></div>'

        + '<div class="sec-head"><h2 style="font-size:var(--t-lg)">In the making</h2><i class="rule"></i><span class="sec-note">proposal → kept → accepted</span></div>'
        + '<p style="font-size:var(--t-sm);color:var(--muted);max-width:70ch">Keeping and accepting are different things. Keeping puts something where you can find it again; accepting writes it into the world, and only happens after the write actually succeeds.</p>'
        + '<div class="grp grp-2" style="margin-top:var(--sp-4)">'+proposals+'</div>'
      + '</div>'

      + '<aside style="display:grid;gap:var(--sp-4)">'
        + '<article class="card card--flat" data-od-id="foundry-inspector">'
          + '<div class="card-head"><h3>Inspector</h3></div>'
          + '<div class="meta-list">'
            + '<div class="meta-row"><span class="meta-key">pack</span><span class="meta-val" style="font-family:var(--font-mono);font-size:var(--t-sm)">emberfield</span></div>'
            + '<div class="meta-row"><span class="meta-key">version</span><span class="meta-val" style="font-family:var(--font-mono);font-size:var(--t-sm)">0.4.2</span></div>'
            + '<div class="meta-row"><span class="meta-key">schema</span><span class="meta-val" style="font-family:var(--font-mono);font-size:var(--t-sm)">vefr.pack/3</span></div>'
            + '<div class="meta-row"><span class="meta-key">asset</span><span class="meta-val">'+esc(asset.name)+'</span></div>'
            + '<div class="meta-row"><span class="meta-key">kind</span><span class="meta-val">'+esc(bin.label)+'</span></div>'
            + '<div class="meta-row"><span class="meta-key">truth</span><span class="meta-val">'+TB[asset.truth].label+'</span></div>'
            + '<div class="meta-row"><span class="meta-key">source</span><span class="meta-val">the hearth, tonight</span></div>'
            + '<div class="meta-row"><span class="meta-key">referenced by</span><span class="meta-val">'+bin.assets.length+' links</span></div>'
          + '</div>'
        + '</article>'
        + '<article class="tray" data-od-id="foundry-tray">'
          + '<div class="card-head"><span class="card-kicker">tray · recently forged</span></div>'
          + '<div style="display:grid;gap:var(--sp-3)">'+TRAY.map(function(t){
              var cls = t.state==='accepted'?'tb-canon':t.state==='failed'?'tb-stale':'tb-player';
              var gl = t.state==='accepted'?'seal':t.state==='failed'?'close':'pin';
              return '<div class="meta-row"><span class="tb '+cls+'">'+icon(gl,'ic--sm')+'<b>'+t.state+'</b></span>'
                + '<span><span style="display:block">'+esc(t.name)+'</span><span class="stat-k" style="display:block;margin-top:2px">'+esc(t.note)+'</span></span></div>';
            }).join('')+'</div>'
        + '</article>'
        + '<article class="card card--quiet">'
          + '<div class="card-head">'+eaSeal()+'<span class="card-kicker">Sunniva, at the bench</span></div>'
          + '<p class="ea-hand">“The pack is missing one thing and I am not going to name it, because you already know. Ask me and I will tell you where I would look.”</p>'
          + '<div class="tb-row" style="margin-top:var(--sp-3)">'
            + '<button class="chip" type="button" data-act="ea-ask" data-q="What is this pack missing?">'+icon('ea','ic--sm')+'<span>What is missing?</span></button>'
          + '</div>'
        + '</article>'
      + '</aside>'
        + eaConvoStarters('foundry', null)
    + '</div>'
  + '</section>';
}

function gameTick(){
  GAME.msg = null;
  render();
}

function gameMove(dx, dy){
  var nx = GAME.player.x + dx, ny = GAME.player.y + dy;
  if(nx<0||ny<0||nx>8||ny>7) return;
  GAME.player.x = nx; GAME.player.y = ny;
  var loc = GAME_MAP.filter(function(l){ return l.x===nx && l.y===ny; })[0];
  if(loc && loc.id !== GAME.loc){
    GAME.loc = loc.id;
    GAME.dialogue = null;
    GAME.inspecting = null;
    GAME.msg = 'You arrive at ' + loc.name + '.';
    GAME.log.unshift({ when:'Now', text:'Arrived at ' + loc.name + '.' });
  }
  render();
}

function gameEnter(){
  var loc = GAME_MAP.filter(function(l){ return l.id===GAME.loc; })[0];
  if(!loc||!loc.enterable) return;
  GAME.scene = GAME.loc;
  GAME.dialogue = null;
  GAME.inspecting = null;
  GAME.msg = 'You enter ' + loc.name + '.';
  render();
}

function gameTalk(npcId){
  var dlg = GAME_DLG[npcId];
  if(!dlg) return;
  GAME.dialogue = { npc:npcId, greeting:dlg.greeting, lines:dlg.lines, said:[] };
  GAME.inspecting = null;
  GAME.npcsSpoken[npcId] = true;
  render();
}

function gameSay(idx){
  if(!GAME.dialogue) return;
  var line = GAME.dialogue.lines[idx];
  if(!line) return;
  GAME.dialogue.said.push({ q:line.q, a:line.a });
  if(line.give && GAME.inventory.indexOf(line.give)<0){
    GAME.inventory.push(line.give);
    GAME.msg = 'Received: ' + line.give;
  }
  render();
}

function gameInspect(itemId){
  var it = itemById(itemId);
  if(!it) return;
  GAME.inspecting = it;
  GAME.dialogue = null;
  if(GAME.itemsFound.indexOf(itemId)<0){
    GAME.itemsFound.push(itemId);
    GAME.inventory.push(itemId);
    GAME.log.unshift({ when:'Now', text:'Found: ' + it.name });
    GAME.msg = 'Found: ' + it.name;
  }
  render();
}

function gameLeaveScene(){
  GAME.scene = null;
  GAME.dialogue = null;
  GAME.inspecting = null;
  render();
}

function viewPlay(){
  var loc = GAME_MAP.filter(function(l){ return l.id===GAME.loc; })[0] || GAME_MAP[0];

  // Build the map grid
  var mapCells = '';
  for(var y=0; y<8; y++){
    for(var x=0; x<9; x++){
      var here = GAME.player.x===x && GAME.player.y===y;
      var locHere = GAME_MAP.filter(function(l){ return l.x===x && l.y===y; })[0];
      var cls = 'gm-cell';
      if(here) cls += ' gm-cell--player';
      if(locHere) cls += ' gm-cell--loc';
      var inner = '';
      if(here) inner = '<span class="gm-player" aria-hidden="true">'+icon('hat')+'</span>';
      else if(locHere) inner = '<span class="gm-locmark">'+icon(locHere.icon,'ic--sm')+'</span>';
      mapCells += '<button class="'+cls+'" type="button" data-act="gm-move" data-x="'+x+'" data-y="'+y+'"'
        + ' aria-label="'+(locHere?locHere.name:'Ground')+(here?' (you are here)':'')+'"'
        + ' style="grid-column:'+(x+1)+';grid-row:'+(y+1)+'">'+inner+'</button>';
    }
  }
  var mapHtml = '<div class="gm-map" role="img" aria-label="Map of the Ashfen reach">'+mapCells+'</div>';

  // Location panel
  var locPanel = '<div class="gm-loc-panel">'
    + '<h3 class="gm-loc-name">'+icon(loc.icon)+'<span>'+esc(loc.name)+'</span></h3>'
    + '<p class="gm-loc-desc">'+esc(loc.desc)+'</p>'
    + '<div class="gm-loc-actions">';
  if(loc.enterable) locPanel += '<button class="btn btn--primary btn--sm" type="button" data-act="gm-enter">'+icon('arrow')+'<span>Enter</span></button>';
  if(loc.npcs.length) locPanel += loc.npcs.map(function(n){
    var f = folkById(n);
    return f ? '<button class="btn btn--sm" type="button" data-act="gm-talk" data-id="'+n+'">'+icon(f.emblem,'ic--sm')+'<span>Talk to '+esc(f.name.split(' ')[0])+'</span></button>' : '';
  }).join('');
  if(loc.items.length) locPanel += loc.items.map(function(i){
    var it = itemById(i);
    var found = GAME.itemsFound.indexOf(i)>=0;
    return it ? '<button class="btn btn--sm'+(found?' btn--quiet':'')+'" type="button" data-act="gm-inspect" data-id="'+i+'">'+icon(it.emblem,'ic--sm')+'<span>'+(found?'Examine again':'Look at')+': '+esc(it.name)+'</span></button>' : '';
  }).join('');
  locPanel += '</div></div>';

  // Inventory
  var invHtml = GAME.inventory.length
    ? '<div class="gm-inv"><h4 class="gm-inv-head">'+icon('box','ic--sm')+'<span>Carrying</span></h4><div class="gm-inv-items">'
      + GAME.inventory.map(function(id){
        var it = itemById(id);
        return it ? '<span class="gm-inv-item">'+icon(it.emblem,'ic--sm')+'<span>'+esc(it.name)+'</span></span>' : '<span class="gm-inv-item">'+esc(id)+'</span>';
      }).join('')
      + '</div></div>'
    : '<div class="gm-inv gm-inv--empty"><p class="ea-hand">Your hands are empty. Look around.</p></div>';

  // Quest log
  var questHtml = '<div class="gm-quests"><h4 class="gm-quest-head">'+icon('scroll','ic--sm')+'<span>Threads</span></h4>'
    + GAME.quests.map(function(q){
      return '<div class="gm-quest" data-status="'+q.status+'">'
        + '<span class="gm-quest-title">'+esc(q.title)+'</span>'
        + '<span class="gm-quest-desc">'+esc(q.desc)+'</span>'
        + '<span class="gm-quest-note">'+esc(q.note)+'</span>'
      + '</div>';
    }).join('') + '</div>';

  // Dialogue box
  var dlgHtml = '';
  if(GAME.dialogue){
    var df = folkById(GAME.dialogue.npc);
    dlgHtml = '<div class="gm-dlg">'
      + '<div class="gm-dlg-head">'+(df?icon(df.emblem):'')+'<span style="font-family:var(--font-display);font-size:var(--t-lg)">'+esc(df?df.name:'')+'</span></div>'
      + '<p class="gm-dlg-greeting">'+esc(GAME.dialogue.greeting)+'</p>';
    GAME.dialogue.said.forEach(function(s){
      dlgHtml += '<div class="gm-dlg-qa"><p class="gm-dlg-q">'+esc(s.q)+'</p><p class="gm-dlg-a">'+esc(s.a)+'</p></div>';
    });
    if(GAME.dialogue.said.length < GAME.dialogue.lines.length){
      dlgHtml += '<div class="gm-dlg-choices">';
      GAME.dialogue.lines.forEach(function(l,i){
        var asked = GAME.dialogue.said.filter(function(s){return s.q===l.q;}).length > 0;
        if(!asked) dlgHtml += '<button class="gm-dlg-btn" type="button" data-act="gm-say" data-idx="'+i+'">'+esc(l.q)+'</button>';
      });
      dlgHtml += '</div>';
    }
    dlgHtml += '<button class="btn btn--sm btn--quiet" type="button" data-act="gm-dlg-close">'+icon('close','ic--sm')+'<span>Step back</span></button></div>';
  }

  // Inspect box
  var inspHtml = '';
  if(GAME.inspecting){
    var it = GAME.inspecting;
    inspHtml = '<div class="gm-inspect">'
      + '<div style="display:flex;align-items:center;gap:var(--sp-3)">'+icon(it.emblem,'ic--lg')+'<span style="font-family:var(--font-display);font-size:var(--t-xl)">'+esc(it.name)+'</span></div>'

      + '<p style="color:var(--faint);font-size:var(--t-sm);margin-top:var(--sp-2)">'+esc(it.origin)+'</p>'
      + '<div class="tb-row" style="margin-top:var(--sp-3)">'+badges(it.truth)+'</div>'
      + '<button class="btn btn--sm" type="button" data-act="gm-inspect-close">'+icon('close','ic--sm')+'<span>Put it away</span></button>'
    + '</div>';
  }

  // Message
  var msgHtml = GAME.msg ? '<div class="gm-msg" role="status">'+esc(GAME.msg)+'</div>' : '';

function eaAnswer(q){
  var s = (q||'').toLowerCase();
  if(s.indexOf('page 41')>-1) return 'Page 41 was folded on the sixth night, after the sentence was written and before Aldous closed the book. He has not unfolded it. I would ask him what he took out, not what he wrote.';
  if(s.indexOf('changed')>-1) return 'Two things: Aldous folded a page, and the shrine store is locked after dark, which it was not last season. Everything else is exactly where you left it.';
  if(s.indexOf('believe')>-1) return 'Probably — two sources, four days apart, neither aware of the other. With one reservation: nobody has heard it themselves and said so plainly.';
  if(s.indexOf('missing')>-1) return 'A person who can hear it. Everyone in this pack has a report about the whisper and nobody has heard it firsthand. I would start with Maren.';
  if(s.indexOf('maren')>-1) return 'Maren has been to the well, counted the doors twice, and was at the treeline on the eighth without saying so. She has not been asked. She is the only one who could settle this.';
  if(s.indexOf('corvin')>-1) return 'Corvin said it sober the first time and drunk the second, and he does not drink before noon. He has never cut the Nine Firs, and he will tell you why if you ask him plainly.';
  if(s.indexOf('isolde')>-1) return 'Isolde is eleven and has been right twice, and both times nobody wrote it down. She found the pendant and gave it up, which is not what a child does.';
  if(s.indexOf('aldous')>-1) return 'Aldous keeps a ledger of arrivals and has stopped writing down meanings. He answers questions he has been asked before, and only those — so ask him twice.';
  if(s.indexOf('bram')>-1) return 'Bram remembers every arrival in nine years, in order, and will not say the name of the last one in front of the room.';
  if(s.indexOf('cast')>-1) return 'The thread rune is a person, not a place. Perthro sits on the folded page. I would not write any of that into the pack.';
  if(s.indexOf('what happened here')>-1 || s.indexOf('happened here')>-1) return 'On the shrine, the sentence was written four nights before it was spoken. On the path, a child found a pendant and gave it away. Those are the two things.';
  if(s.indexOf('ask next')>-1) return 'Maren. She is the only one who could make this true, and the only one who would rather not.';
  return 'I have it noted. Ask me about the ledger, about Maren, about what changed — or tell me what you want written down and I will tell you honestly whether the world agrees.';
}

   ========================================================================== */
function railItem(it, rr){
  return '<a class="rail-item fadeable" href="#/'+it.id+'" aria-current="'+(rr===it.id?'page':'false')+'" data-od-id="nav-'+it.id+'">'
    + icon(it.glyph)+'<span class="rail-label">'+esc(it.label)+'</span>'
    + (it.note?'<span class="rail-note">'+it.note+'</span>':'')+'</a>';
}
function renderRail(){
  var r = state.room;
  var groups = RAIL_GROUPS.map(function(g){
    return '<div class="rail-group"><div class="rail-legend">'+esc(g.legend)+'</div>'
      + g.items.map(function(it){ return railItem(it, r); }).join('')+'</div>';
  }).join('');
  var foot = RAIL_FOOT.map(function(it){ return railItem(it, r); }).join('');
  return '<div class="brand"><div class="brand-mark">VE<span>F</span>R</div><div class="brand-sub">Inhabited manuscript workshop</div></div>'
    + '<div class="spine"><div class="spine-top"><span class="spine-dot"></span><span class="spine-label">open world</span></div>'
      + '<div class="spine-world">'+esc(WORLD.name)+'</div>'
      + '<div class="spine-meta">chapter IV · the hearth at twilight</div></div>'
    + '<nav aria-label="Rooms">'+groups+'</nav>'
    + '<div class="rail-foot">'+foot
      + '<p class="stat-k" style="margin:var(--sp-3) var(--sp-2) 0">pack v0.4.2 · kept tonight</p></div>';
}
function renderMobnav(){
  var r = state.room;
  var links = MOBNAV.map(function(id){
    var it = { id:id, label:ROOM_LABEL[id], glyph:RAIL_GROUPS.reduce(function(a,g){ return a.concat(g.items); },[]).concat(RAIL_FOOT).filter(function(x){ return x.id===id; })[0].glyph };
    return '<a href="#/'+id+'" aria-current="'+(r===id?'page':'false')+'" data-od-id="mobnav-'+id+'">'+icon(it.glyph)+'<span class="mobnav-label">'+esc(it.label)+'</span></a>';
  }).join('');
  return '<div class="mobnav-in">'+links
    + '<button type="button" data-act="sheet-open" aria-pressed="'+(r!=='hall'&&MOBNAV.indexOf(r)===-1)+'" data-od-id="mobnav-more">'+icon('menu')+'<span class="mobnav-label">Rooms</span></button></div>';
}
function renderSheet(){
  var all = RAIL_GROUPS.reduce(function(a,g){ return a.concat(g.items); },[]).concat(RAIL_FOOT);
  return '<button class="sheet-scrim" type="button" data-act="sheet-close" aria-label="Close"></button>'
    + '<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="All rooms">'
      + '<div class="sheet-grip" aria-hidden="true"></div>'
      + '<div class="card-head"><h2 style="font-size:var(--t-xl)">Rooms</h2><span class="card-kicker" style="margin-left:auto">'+esc(WORLD.name)+'</span></div>'
      + '<div class="sheet-grid" style="margin-top:var(--sp-4)">'+all.map(function(it){
          return '<a class="sheet-link" href="#/'+it.id+'" data-act="sheet-close" aria-current="'+(state.room===it.id?'page':'false')+'">'
            + icon(it.glyph)+'<span>'+esc(it.label)+'</span></a>';
        }).join('')+'</div>'
    + '</div>';
}

/* ==========================================================================
   Router
   ========================================================================== */
var VIEWS = { hall:viewHall, desk:viewDesk, map:viewMap, folks:viewFolks, vault:viewVault,
  chronicle:viewChronicle, runes:viewRunes, archives:viewArchives, foundry:viewFoundry,
  play:viewPlay, export:viewExport, settings:viewSettings };

function applyPrefs(){
  var h = document.documentElement;
  h.setAttribute('data-theme', state.theme);
  h.setAttribute('data-font', state.font);
  h.setAttribute('data-size', state.size);
  h.setAttribute('data-density', state.density);
  h.setAttribute('data-motion', state.motion);
  h.setAttribute('data-contrast', state.contrast);
  h.setAttribute('data-ornament', state.ornament);
  h.setAttribute('data-playview', state.playview);
}
function parseHash(){
  var raw = (location.hash||'').replace(/^#\/?/, '');
  var parts = raw.split('/');
  var room = VIEWS[parts[0]] ? parts[0] : (raw ? 'desk' : (load('room')||'desk'));
  if(!VIEWS[room]) room = 'desk';
  return { room:room, id:parts[1] ? decodeURIComponent(parts[1]) : null };
}
function announce(msg){
  var el = document.getElementById('live');
  if(el){ el.textContent = ''; el.textContent = msg; }
}
function render(opts){
  opts = opts || {};
  applyPrefs();
  var h = parseHash();
  var changed = h.room !== state.room;
  state.room = h.room;
  if(h.id) state.id = h.id;
  if(h.room==='folks' && h.id && folkById(h.id)) state.folk = h.id;
  if(h.room==='vault' && h.id && itemById(h.id)) state.item = h.id;
  if(h.room==='map' && h.id && locById(h.id)) state.loc = h.id;

  document.getElementById('rail').innerHTML = renderRail();
  document.getElementById('mobnav').innerHTML = renderMobnav();
  document.getElementById('ea').innerHTML = renderEA();
  document.getElementById('stage').innerHTML = (VIEWS[state.room] || viewDesk)(h.id);
  var sheet = document.getElementById('sheet');
  if(sheet && !sheet.hidden) sheet.innerHTML = renderSheet();

  save('room', state.room);
  if(changed){
    window.scrollTo(0,0);
    try{ document.getElementById('stage').focus({ preventScroll:true }); }catch(e){}
    document.title = 'VEFR — ' + ROOM_LABEL[state.room];
  }
}

/* ==========================================================================
   Actions
   ========================================================================== */
function setPref(k, v){ state[k] = v; save(k, v); applyPrefs(); render(); }

function doAct(act, el){
  var id = el.getAttribute('data-id');
  switch(act){
    case 'enter-world':
      state.world = id || 'emberfield'; save('world', state.world); render(); break;
    case 'world-pick':
      state.world = id; save('world', state.world); render();
      announce(worldById(id).name + ' — ' + worldById(id).cue + (worldById(id).open ? '' : ' It is kept, not open.'));
      break;
    case 'new-world':
      state.bin = 'lore'; state.room = 'foundry'; break;
    case 'desk-touch': {
      var lines = { hearth:'The fire is banked and still going. Somebody expects the room to be used.',
        lamp:'You left it burning. That is why the room is warm.',
        mapscrap:'Nine firs, nine intervals, and one extra mark you have not explained to yourself yet.' };
      announce(lines[id] || 'You turn it over. Nothing underneath.');
      break;
    }
    case 'open-item':
      state.item = id; location.hash = '#/vault/' + id; return;
    case 'item':
      state.item = id; render(); break;
    case 'folk':
      state.folk = id; if(state.room!=='folks'){ location.hash = '#/folks/' + id; return; } render(); break;
    case 'folk-shuffle': {
      var pool = FOLKS.filter(function(f){ return f.id!==state.folk; });
      var pick = pool[Math.floor(Math.random()*pool.length)];
      state.folk = pick.id; render();
      announce('Nearest: ' + pick.name + ' — ' + pick.line);
      break;
    }
    case 'folk-walk':
      state.folkWalk = !state.folkWalk; render();
      announce(state.folkWalk ? 'Walking through the world. Meet the people.' : 'Back to the dossier.');
      break;
    case 'loc':
      state.loc = id; render(); break;
    case 'brush':
      state.brush = id; render(); break;
    case 'keep-sketch': {
      state.sketches = state.sketches || [];
      state.sketches.unshift({ when:'tonight', text:'The treeline, from the ridge — kept as it stands.' });
      state.extra.unshift({ kind:'discovery', when:'Tonight', title:'A sketch of the treeline, kept',
        body:'Nine intervals and one extra mark, drawn from the ridge and kept without being corrected.' });
      render();
      announce('Sketch kept. It is in the Chronicle and in the Vault, with your name on it.');
      break;
    }
    case 'chron-filter':
      state.chronFilter = id; render(); break;
    case 'open-chapter': {
      state.extra.unshift({ kind:'chapter', chapter:'V', title:'The Keeper of the Stair',
        sub:'Emberfield · opened tonight, at the hearth' });
      state.chronFilter = 'all'; render();
      announce('Chapter V opened at the hearth. The Chronicle now ends above it.');
      break;
    }
    case 'rune-slot': {
      var i = parseInt(el.getAttribute('data-i'), 10);
      state.slot = i;
      if(!state.turned[i]){ state.turned[i] = true; announce(runeById(state.placed[i]).name + ' turned over: ' + runeById(state.placed[i]).meaning); }
      render(); break;
    }
    case 'rune-turn': {
      var s = state.slot;
      state.turned[s] = !state.turned[s];
      announce(state.turned[s] ? 'Turned over. This is an interpretation, not a finding.' : 'Face down again.');
      render(); break;
    }
    case 'rune-hold': {
      state.held[id] = !state.held[id];
      announce(state.held[id] ? runeById(id).name + ' held for later.' : runeById(id).name + ' returned to the drawer.');
      render(); break;
    }
    case 'rune-place': {
      var old = state.placed[state.slot];
      state.placed[state.slot] = id;
      state.turned[state.slot] = true;
      render();
      announce(runeById(id).name + ' placed in “' + SPREAD[state.slot].slot + '”, replacing ' + runeById(old).name + '.');
      break;
    }
    case 'layer':
      state.layer = (state.layer===id) ? null : id;
      render(); break;
    case 'archive-question': {
      state.extra.unshift({ kind:'question', when:'Tonight', title:'Who folded page 41, and what was on the other side of the fold?',
        body:'Written down from the Archives as a question. The verdict was not written into the world — a question has somewhere to go, and a verdict does not.' });
      render();
      announce('Written into the Chronicle as an open question. The world is unchanged.');
      break;
    }
    case 'prop-make': {
      state.propState[id] = 'accepted';
      var p = PROPOSALS.filter(function(x){ return x.id===id; })[0];
      state.extra.unshift({ kind:'discovery', when:'Tonight', title:p.title + ' — made real',
        body:'Accepted into the Emberfield pack at 22:41, after the write succeeded. It now has a place, and can be returned to.' });
      render();
      announce(p.title + ' accepted. Written to the pack — it has a place now.');
      break;
    }
    case 'prop-keep': {
      state.propState[id] = 'kept';
      render();
      announce('Kept, not accepted. It sits on the desk until you decide.');
      break;
    }
    case 'bin':
      state.bin = id; state.asset = 0; render(); break;
    case 'asset':
      state.asset = parseInt(el.getAttribute('data-i'), 10); render(); break;
    case 'whisper-place': {
      var to = el.getAttribute('data-to');
      state.whisperWhere[id] = to;
      render();
      announce('Whisper moved to the ' + to + '. Source and uncertainty came with it.');
      break;
    }
    case 'playview':
      state.playview = id; applyPrefs(); render(); break;
    case 'play-choice':
      state.playChoice = id; render();
      announce('Noted, and not taken. A running world would carry the scene on from here.');
      break;
    case 'play-talk':
      state.playTalk = id; state.playInspect = null; render();
      break;
    case 'play-talk-close':
      state.playTalk = null; render();
      break;
    case 'play-inspect':
      state.playInspect = id; state.playTalk = null; render();
      break;
    case 'play-inspect-close':
      state.playInspect = null; render();
      break;
    case 'play-go':
      state.playPlace = id; state.playTalk = null; state.playInspect = null; render();
      var dest = PLACES.filter(function(p){return p.id===id;})[0];
      announce('You walk to ' + (dest?dest.name:id) + '.');
      break;
    case 'set-on-desk':
      state.onDesk = id; render();
      announce('Set on the desk. Go and look — the hearth is beside it.');
      break;
    case 'theme': setPref('theme', id); announce('Reading room: ' + id + '. Every surface changed, not just the accent.'); break;
    case 'font': setPref('font', id); break;
    case 'size': setPref('size', id); break;
    case 'density': setPref('density', id); break;
    case 'motion': setPref('motion', state.motion==='on'?'off':'on'); break;
    case 'contrast': setPref('contrast', state.contrast==='high'?'normal':'high'); break;
    case 'ornament': setPref('ornament', state.ornament==='on'?'off':'on'); break;
    case 'export-toggle':
      state.exportOn[id] = !state.exportOn[id]; render(); break;
    case 'export-bind':
      state.reading = true; render();
      announce('Bound. One volume, four chapters, twelve entries, three plates — set in the pack’s own type and ready to print.');
      break;
    case 'bind-chronicle':
      Object.keys(state.exportOn).forEach(function(k){ state.exportOn[k] = (k==='chronicle'); });
      state.reading = true; render();
      announce('The Chronicle is bound on its own, unfinished parts kept exactly as they stand.');
      break;
    case 'ea-toggle':
      state.eaOpen = !state.eaOpen;
      if(!state.eaOpen) state.eaAsk = null;
      render();
      if(state.eaOpen){ var inp = document.getElementById('ea-input'); if(inp) inp.focus(); }
      break;
    case 'ea-close':
      state.eaOpen = false; state.eaAsk = null; render(); break;
    case 'ea-ask':
      state.eaAsk = el.getAttribute('data-q'); state.eaOpen = true; render();
      break;
    case 'ea-convo':
      EA_CONVO_STATE = { room: el.getAttribute('data-room'), topic: el.getAttribute('data-topic'), idx: parseInt(el.getAttribute('data-idx'),10) };
      render();
      break;
    case 'ea-convo-close':
      EA_CONVO_STATE = null;
      render();
      break;
    case 'ea-keep': {
      var kq = el.getAttribute('data-q');
      var ka = el.getAttribute('data-a');
      var kr = el.getAttribute('data-room');
      EA_KEPT.unshift({ q:kq, a:ka, room:kr, when:'just now' });
      render();
      announce('Kept. It is on the desk now.');
      break;
    }
    case 'gm-move':
      gameMove(parseInt(el.getAttribute('data-x'),10)-GAME.player.x, parseInt(el.getAttribute('data-y'),10)-GAME.player.y);
      break;
    case 'gm-enter':
      gameEnter(); break;
    case 'gm-talk':
      gameTalk(el.getAttribute('data-id')); break;
    case 'gm-say':
      gameSay(parseInt(el.getAttribute('data-idx'),10)); break;
    case 'gm-inspect':
      gameInspect(el.getAttribute('data-id')); break;
    case 'gm-leave':
      gameLeaveScene(); break;
    case 'gm-dlg-close':
      GAME.dialogue = null; render(); break;
    case 'gm-inspect-close':
      GAME.inspecting = null; render(); break;
    case 'ea-send': {
      var field = document.getElementById('ea-input');
      var q = field && field.value ? field.value.trim() : '';
      state.eaAsk = q || (EA_ASK[state.room] || 'Where did we leave off?');
      state.eaOpen = true; render();
      break;
    }
    case 'sheet-open':
      var sh = document.getElementById('sheet');
      sh.innerHTML = renderSheet(); sh.hidden = false;
      var f = sh.querySelector('.sheet-link'); if(f) f.focus();
      break;
    case 'sheet-close':
      var s2 = document.getElementById('sheet'); s2.hidden = true; break;
  }
}
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.getAttribute('data-act');
  if(el.tagName === 'A' && /^#\//.test(el.getAttribute('href')||'')){
    doAct(act, el);
    return;
  }
  e.preventDefault();
  doAct(act, el);
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    var sh = document.getElementById('sheet');
    if(sh && !sh.hidden){ sh.hidden = true; return; }
    if(state.eaOpen){ state.eaOpen = false; state.eaAsk = null; render(); return; }
  }
  if(e.key === 'Enter' && e.target && e.target.id === 'ea-input'){
    e.preventDefault();
    var v = e.target.value ? e.target.value.trim() : '';
    state.eaAsk = v || (EA_ASK[state.room] || 'Where did we leave off?');
    state.eaOpen = true; render();
    var back = document.getElementById('ea-input'); if(back) back.focus();
    return;
  }
  if(state.room !== 'runes') return;
  var t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT')) return;
  var inCloth = t && t.closest && (t.closest('.cloth') || t.closest('.drawer') || t.closest('[data-od-id="runes-reading"]'));
  if(!inCloth) return;
  if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); state.slot=(state.slot+1)%4; render(); }
  else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); state.slot=(state.slot+3)%4; render(); }
  else if(e.key.toLowerCase() === 'h'){ e.preventDefault(); var r=runeById(state.placed[state.slot]); state.held[r.id]=!state.held[r.id]; render(); announce(state.held[r.id]?r.name+' held.':r.name+' returned.'); }
});
window.addEventListener('hashchange', function(){ render(); });
document.addEventListener('input', function(e){
  if(e.target && e.target.id === 'ea-input'){ /* typed but not sent */ }
});

/* boot */
render();
if(!location.hash){ location.replace('#/' + (load('room') || 'desk')); }
announce('VEFR. The workshop is open at the ' + ROOM_LABEL[state.room] + '. Sunniva is within call from every room.');

/* Keyboard: arrow keys / WASD for game movement */
document.addEventListener('keydown', function(e){
  if(state.room !== 'play' || GAME.scene) return;
  var tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;
  var dx=0, dy=0;
  switch(e.key){
    case 'ArrowUp': case 'w': case 'W': dy=-1; break;
    case 'ArrowDown': case 's': case 'S': dy=1; break;
    case 'ArrowLeft': case 'a': case 'A': dx=-1; break;
    case 'ArrowRight': case 'd': case 'D': dx=1; break;
    case 'Enter': case 'e': case 'E': gameEnter(); e.preventDefault(); return;
    default: return;
  }
  e.preventDefault();
  gameMove(dx, dy);
});
</script>
</body>
</html>
