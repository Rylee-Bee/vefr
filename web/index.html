<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Old Name</title>
<style>
  :root {
    --bg: #131311;
    --card: #1d1b17;
    --card-edge: #3a352c;
    --ink: #e8e5df;
    --ink-dim: #a39e92;
    --accent: #c9ad6b;
    --church: #2a2e33;
    --danger: #b8543f;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  header {
    max-width: 40rem;
    margin: 0 auto;
    padding: 2.5rem 1rem 0;
  }
  header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: normal;
    letter-spacing: 0.12em;
  }
  header .tagline { color: var(--ink-dim); margin: 0.3rem 0 0; font-size: 0.95rem; }

  main { max-width: 40rem; margin: 0 auto; padding: 0 1rem 3rem; }

  .phase-rail {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 1.6rem 0 0;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--card-edge);
  }
  .phase-rail button {
    font: inherit;
    font-size: 0.88rem;
    padding: 0.5rem 1rem;
    min-height: 44px;
    border-radius: 3px;
    border: 1px solid var(--card-edge);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .phase-rail button[aria-pressed="true"] {
    color: var(--ink);
    border-color: var(--ink-dim);
    background: var(--card);
  }
  .phase-rail button[data-phase="awed"][aria-pressed="true"] {
    color: var(--accent);
    border-color: var(--accent);
  }
  .phase-rail button:hover { border-color: var(--accent); }
  .phase-rail button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .controls { display: flex; align-items: center; gap: 0.8rem; margin: 1.2rem 0 0; }
  .controls button {
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--ink-dim);
    border-radius: 4px;
    padding: 0.55rem 1.4rem;
    min-height: 44px;
    min-width: 44px;
    cursor: pointer;
  }
  .controls button:hover:not([disabled]) { border-color: var(--accent); }
  .controls button[disabled] { opacity: 0.45; cursor: wait; }
  .controls .note { color: var(--ink-dim); font-size: 0.88rem; font-style: italic; }

  #feed { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.4rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 6px;
    padding: 1rem 1.2rem;
    overflow-wrap: anywhere;
  }
  .card .speaker { color: var(--ink-dim); font-size: 0.85rem; letter-spacing: 0.06em; }
  .card .whisper { margin: 0.4rem 0 0; }
  .card .hook { color: var(--ink-dim); font-style: italic; margin: 0.5rem 0 0; font-size: 0.92rem; }
  .card .truth { color: var(--ink-dim); font-size: 0.82rem; margin-top: 0.4rem; }

  .card[data-phase="awed"] { border-color: var(--accent); }
  .card[data-phase="awed"] .speaker { color: var(--accent); }
  .card[data-phase="feared"] { border-color: var(--church); }

  .tabs { display: flex; gap: 0.4rem; margin: 1.6rem 0 0; }
  .tabs button {
    font: inherit;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    padding: 0.5rem 1.2rem;
    min-height: 44px;
    border-radius: 3px 3px 0 0;
    border: 1px solid var(--card-edge);
    border-bottom: none;
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .tabs button[aria-selected="true"] {
    color: var(--ink);
    background: var(--card);
  }
  .tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .view[hidden] { display: none; }

  .card[data-bond="attuned"] { border-color: var(--accent); }
  .card[data-bond="attuned"] .speaker { color: var(--accent); }
  .card[data-bond="assigned"] { border-color: var(--church); }
  .card[data-bond="cold"] { border-color: var(--card-edge); opacity: 0.85; }

  .item-kind { color: var(--ink-dim); font-size: 0.85rem; font-style: italic; }
  .item-curse { color: var(--ink-dim); margin: 0.4rem 0 0; font-size: 0.92rem; }
  .item-curse::before { content: "the weight: "; }

  .empty { color: var(--ink-dim); font-style: italic; margin-top: 1.4rem; }
  .error { color: var(--danger); margin-top: 1.4rem; }
  .vault-title {
    font-weight: normal;
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin: 1.8rem 0 0;
    padding-bottom: 0.3rem;
    border-bottom: 1px solid var(--card-edge);
  }

  @keyframes settle { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <h1>OLD-NAME</h1>
  <p class="tagline">memory &amp; longing, flying out and coming home</p>
</header>
<main>
  <div class="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" id="tab-rumors" aria-selected="true" aria-controls="view-rumors">Rumors</button>
    <button type="button" role="tab" id="tab-vault" aria-selected="false" aria-controls="view-vault">Vault</button>
  </div>

  <section id="view-rumors" class="view" role="tabpanel" aria-labelledby="tab-rumors">
    <div class="phase-rail" role="group" aria-label="Rumor phase">
      <button type="button" data-phase="whispers" aria-pressed="true">whispers</button>
      <button type="button" data-phase="doubts" aria-pressed="false">doubts</button>
      <button type="button" data-phase="feared" aria-pressed="false">feared</button>
      <button type="button" data-phase="awed" aria-pressed="false">awed</button>
    </div>

    <div class="controls">
      <button type="button" id="whisper-btn">Whisper</button>
      <span class="note" id="status">the mill is warm</span>
    </div>

    <section id="feed" aria-live="polite">
      <p class="empty">The mill is quiet. Press Whisper.</p>
    </section>
  </section>

  <section id="view-vault" class="view" role="tabpanel" aria-labelledby="tab-vault" hidden>
    <div class="controls">
      <button type="button" id="forge-btn">Forge</button>
      <span class="note" id="forge-status">most are assigned or cold. the attuned are rare.</span>
    </div>
    <section id="forge-out" aria-live="polite"></section>
    <h2 class="vault-title">Kept</h2>
    <section id="vault-list" aria-live="polite"></section>
  </section>
</main>

<script>
(function () {
  var currentPhase = 'whispers';
  var rail = document.querySelector('.phase-rail');
  var btn = document.getElementById('whisper-btn');
  var status = document.getElementById('status');
  var feed = document.getElementById('feed');
  var empty = feed.querySelector('.empty');
  var forgeBtn = document.getElementById('forge-btn');
  var forgeStatus = document.getElementById('forge-status');
  var forgeOut = document.getElementById('forge-out');
  var vaultList = document.getElementById('vault-list');
  var lastForged = null;

  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[role="tab"]');
    if (!b) return;
    document.querySelectorAll('.tabs button').forEach(function (x) {
      x.setAttribute('aria-selected', x === b ? 'true' : 'false');
    });
    document.getElementById('view-rumors').hidden = b.id !== 'tab-rumors';
    document.getElementById('view-vault').hidden = b.id !== 'tab-vault';
    if (b.id === 'tab-vault') renderVault();
  });

  rail.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-phase]');
    if (!b) return;
    currentPhase = b.dataset.phase;
    rail.querySelectorAll('button').forEach(function (x) {
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
  });

  btn.addEventListener('click', async function () {
    btn.disabled = true;
    status.textContent = 'the mill turns\u2026';
    try {
      var r = await fetch('/api/rumor', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phase: currentPhase }),
      });
      if (!r.ok) throw new Error('mill jammed');
      var c = await r.json();
      if (empty) empty.remove();
      feed.insertAdjacentHTML('afterbegin', whisperHTML(c, currentPhase));
      status.textContent = 'the mill is warm';
    } catch (err) {
      status.textContent = 'the mill is silent. is the model loaded?';
    } finally {
      btn.disabled = false;
    }
  });

  forgeBtn.addEventListener('click', async function () {
    forgeBtn.disabled = true;
    forgeStatus.textContent = 'the forge heats\u2026';
    forgeOut.innerHTML = '';
    try {
      var r = await fetch('/api/forge', { method: 'POST' });
      if (!r.ok) throw new Error('forge cold');
      lastForged = await r.json();
      forgeOut.innerHTML = itemHTML(lastForged, true);
    } catch (err) {
      forgeStatus.textContent = 'the forge is cold. is the model loaded?';
    } finally {
      forgeBtn.disabled = false;
    }
  });

  forgeOut.addEventListener('click', async function (e) {
    var b = e.target.closest('button[data-keep]');
    if (!b || !lastForged) return;
    b.disabled = true;
    try {
      var r = await fetch('/api/vault', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(lastForged),
      });
      var res = await r.json();
      forgeStatus.textContent = res.bond === 'attuned'
        ? 'it fits her hands. it was always going to.'
        : res.bond === 'assigned'
          ? 'kept. it works, mostly. it never asked what she wants.'
          : 'kept. it does not care who holds it.';
      b.remove();
      renderVault();
    } catch (err) {
      forgeStatus.textContent = 'the vault did not answer.';
      b.disabled = false;
    }
  });

  function whisperHTML(c, ph) {
    var hook = c.hook ? '<p class="hook">' + esc(c.hook) + '</p>' : '';
    var truth = c.is_true ? '' : '<p class="truth">a lie, or close enough</p>';
    return '<article class="card" data-phase="' + ph + '">'
      + '<div class="speaker">' + esc(c.speaker) + '</div>'
      + '<p class="whisper">&ldquo;' + esc(c.whisper) + '&rdquo;</p>'
      + hook + truth + '</article>';
  }

  function itemHTML(item, offerable) {
    var curse = item.curse ? '<p class="item-curse">' + esc(item.curse) + '</p>' : '';
    var enchant = item.enchant ? '<p class="whisper">' + esc(item.enchant) + '</p>' : '';
    var offer = offerable
      ? '<button type="button" data-keep="1">offer your hand</button>'
      : '';
    return '<article class="card" data-bond="' + item.bond + '">'
      + '<div class="speaker">' + esc(item.name) + '</div>'
      + '<div class="item-kind">' + esc(item.bond) + ' &middot; ' + esc(item.kind) + '</div>'
      + enchant + curse
      + '<p class="whisper">' + esc(item.lore) + '</p>'
      + offer + '</article>';
  }

  async function renderVault() {
    try {
      var r = await fetch('/api/vault');
      var items = await r.json();
      vaultList.innerHTML = items.length
        ? items.slice().reverse().map(function (i) { return itemHTML(i, false); }).join('')
        : '<p class="empty">Nothing kept yet. Forge something worth carrying.</p>';
    } catch (err) {
      vaultList.innerHTML = '<p class="error">the vault did not answer.</p>';
    }
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
})();
</script>
</body>
</html>
