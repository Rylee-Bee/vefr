<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Old Name</title>
<style>
  :root {
    --bg: #131311;
    --card: #1d1b17;
    --card-edge: #3a352c;
    --ink: #e8e5df;
    --ink-dim: #a39e92;
    --accent: #c9ad6b;
    --church: #2a2e33;
    --danger: #b8543f;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  header {
    max-width: 40rem;
    margin: 0 auto;
    padding: 2.5rem 1rem 0;
  }
  header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: normal;
    letter-spacing: 0.12em;
  }
  header .tagline { color: var(--ink-dim); margin: 0.3rem 0 0; font-size: 0.95rem; }

  main { max-width: 40rem; margin: 0 auto; padding: 0 1rem 3rem; }

  .phase-rail {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 1.6rem 0 0;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--card-edge);
  }
  .phase-rail button {
    font: inherit;
    font-size: 0.88rem;
    padding: 0.5rem 1rem;
    min-height: 44px;
    border-radius: 3px;
    border: 1px solid var(--card-edge);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
  }
  .phase-rail button[aria-pressed="true"] {
    color: var(--ink);
    border-color: var(--ink-dim);
    background: var(--card);
  }
  .phase-rail button[data-phase="awed"][aria-pressed="true"] {
    color: var(--accent);
    border-color: var(--accent);
  }
  .phase-rail button:hover { border-color: var(--accent); }
  .phase-rail button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .controls { display: flex; align-items: center; gap: 0.8rem; margin: 1.2rem 0 0; }
  .controls button {
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--ink-dim);
    border-radius: 4px;
    padding: 0.55rem 1.4rem;
    min-height: 44px;
    min-width: 44px;
    cursor: pointer;
  }
  .controls button:hover:not([disabled]) { border-color: var(--accent); }
  .controls button[disabled] { opacity: 0.45; cursor: wait; }
  .controls .note { color: var(--ink-dim); font-size: 0.88rem; font-style: italic; }

  #feed { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.4rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: 6px;
    padding: 1rem 1.2rem;
    overflow-wrap: anywhere;
  }
  .card .speaker { color: var(--ink-dim); font-size: 0.85rem; letter-spacing: 0.06em; }
  .card .whisper { margin: 0.4rem 0 0; }
  .card .hook { color: var(--ink-dim); font-style: italic; margin: 0.5rem 0 0; font-size: 0.92rem; }
  .card .truth { color: var(--ink-dim); font-size: 0.82rem; margin-top: 0.4rem; }

  .card[data-phase="awed"] { border-color: var(--accent); }
  .card[data-phase="awed"] .speaker { color: var(--accent); }
  .card[data-phase="feared"] { border-color: var(--church); }

  .empty { color: var(--ink-dim); font-style: italic; margin-top: 1.4rem; }
  .error { color: var(--danger); margin-top: 1.4rem; }

  @keyframes settle { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header>
  <h1>OLD-NAME</h1>
  <p class="tagline">memory &amp; longing, flying out and coming home</p>
</header>
<main>
  <div class="phase-rail" role="group" aria-label="Rumor phase">
    <button type="button" data-phase="whispers" aria-pressed="true">whispers</button>
    <button type="button" data-phase="doubts" aria-pressed="false">doubts</button>
    <button type="button" data-phase="feared" aria-pressed="false">feared</button>
    <button type="button" data-phase="awed" aria-pressed="false">awed</button>
  </div>

  <div class="controls">
    <button type="button" id="whisper-btn">Whisper</button>
    <span class="note" id="status">the mill is warm</span>
  </div>

  <section id="feed" aria-live="polite">
    <p class="empty">The mill is quiet. Press Whisper.</p>
  </section>
</main>

<script>
(function () {
  var phase = 'whispers';
  var rail = document.querySelector('.phase-rail');
  var btn = document.getElementById('whisper-btn');
  var status = document.getElementById('status');
  var feed = document.getElementById('feed');
  var empty = feed.querySelector('.empty');

  rail.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-phase]');
    if (!b) return;
    phase = b.dataset.phase;
    rail.querySelectorAll('button').forEach(function (x) {
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
  });

  btn.addEventListener('click', async function () {
    btn.disabled = true;
    status.textContent = 'the mill turns\u2026';
    try {
      var r = await fetch('/api/rumor', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phase: phase }),
      });
      if (!r.ok) throw new Error('mill jammed');
      var c = await r.json();
      if (empty) empty.remove();
      feed.insertAdjacentHTML('afterbegin', cardHTML(c, phase));
      status.textContent = 'the mill is warm';
    } catch (err) {
      status.textContent = 'the mill is silent. is the model loaded?';
    } finally {
      btn.disabled = false;
    }
  });

  function cardHTML(c, ph) {
    var hook = c.hook ? '<p class="hook">' + esc(c.hook) + '</p>' : '';
    var truth = c.is_true ? '' : '<p class="truth">a lie, or close enough</p>';
    return '<article class="card" data-phase="' + ph + '">'
      + '<div class="speaker">' + esc(c.speaker) + '</div>'
      + '<p class="whisper">&ldquo;' + esc(c.whisper) + '&rdquo;</p>'
      + hook + truth + '</article>';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
})();
</script>
</body>
</html>
